<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <!-- Dynamic Title populated by JS -->
    <title>S.Baruah Science Academy</title>
    
    <!-- Base CSS Architecture -->
    <link rel="stylesheet" href="assets/css/tokens.css">
    <link rel="stylesheet" href="assets/css/reset.css">
    <link rel="stylesheet" href="assets/css/layout.css">
    <link rel="stylesheet" href="assets/css/components.css">
    
    <!-- Temporary Style for Boot Wrapper - to be replaced by actual Layout module -->
    <style>
        #nexus-app-root {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
    </style>
</head>
<body>

    <!-- Main Application Entry Point -->
    <div id="nexus-app-root">
        <!-- Future Shell/Navigation injection -->
    </div>

    <!-- Configuration & State Management -->
    <script src="config/site-config.js"></script>
    <script src="assets/js/core/state.js"></script>
    
    <!-- Initialize App Metadata -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            document.title = window.SiteConfig.app.name;
            console.log(`[SYSTEM] Booting ${window.SiteConfig.app.name} v${window.SiteConfig.app.version}`);
        });
    </script>
</body>
</html>
